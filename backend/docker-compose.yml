# Sandbox local: um Postgres e a aplicação. Nada de Kubernetes nesta escala.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora"]
      interval: 5s
      retries: 10
    volumes:
      - aurora-db:/var/lib/postgresql/data

volumes:
  aurora-db:
