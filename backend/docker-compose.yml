# Sandbox local completo: banco e API. Um `docker compose up` e o Aurora
# está no ar em http://localhost:8080/docs — nada de Kubernetes nesta escala.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aurora-db:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy   # o Flyway falha se o banco não estiver pronto
    environment:
      # Dentro da rede do compose o host do banco é o nome do serviço.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aurora
      SPRING_DATASOURCE_USERNAME: aurora
      SPRING_DATASOURCE_PASSWORD: aurora
      SPRING_PROFILES_ACTIVE: sandbox
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  aurora-db:
