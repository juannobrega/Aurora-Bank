# Docker Desktop 29 exige API >= 1.44 (o `docker version` reporta 1.52 com
# mínimo 1.44). O cliente do Testcontainers negocia uma versão mais antiga e
# recebe HTTP 400 com payload vazio, que aparece como "Could not find a valid
# Docker environment". Fixar a versão da API resolve.
api.version=1.44
