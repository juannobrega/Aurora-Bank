spring:
  application:
    name: aurora-bank
  datasource:
    url: jdbc:postgresql://localhost:5432/aurora
    username: aurora
    password: aurora
  jpa:
    hibernate:
      ddl-auto: validate      # o schema é do Flyway, nunca do Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

aurora:
  jwt:
    # HMAC-SHA256 em Base64. Chave de DESENVOLVIMENTO — injete por variável
    # de ambiente em qualquer uso sério.
    secret: ${AURORA_JWT_SECRET:WOgfoW09MUdJyulwcc8aEgX5FEJeDp68yBwr7MPlhZQ=}
  admin:
    # Chave do painel de gestão. Chave de DESENVOLVIMENTO — injete por
    # variável de ambiente em qualquer uso sério.
    key: ${AURORA_ADMIN_KEY:aurora-admin-dev-key-trocar}
  crypto:
    # AES-256 em Base64 (32 bytes). Cifra o template biométrico em repouso.
    # Esta é uma chave de DESENVOLVIMENTO: em qualquer uso sério, injete por
    # variável de ambiente e nunca versione. Gere outra com
    # TemplateCipher.generateKey().
    template-key: ${AURORA_TEMPLATE_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

management:
  endpoints:
    web:
      exposure:
        include: health   # só health atravessa; o resto fica fechado
  endpoint:
    health:
      show-details: never

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
